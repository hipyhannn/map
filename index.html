<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acumil Auto Maps (128x95)</title>
  <style>
    :root {
      --bg: #0f1222;
      --card: #191f38;
      --ink: #f4f6ff;
      --muted: #98a2c7;
      --accent: #ff5ca0;
      --ok: #2ee59d;
      --warn: #ffb84d;
      --err: #ff5c77;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); }
    .wrap {
      max-width: 450px; margin: 0 auto; background: var(--card);
      border: 1px solid #2c355e; border-radius: 12px; padding: 16px;
    }
    h2 { margin: 0 0 4px; font-size: 18px; color: var(--accent); }
    .sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.4; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      flex: 1; padding: 10px 10px; border: none; border-radius: 8px;
      font-weight: 700; cursor: pointer; background: #2b355e; color: var(--ink); font-size: 12px;
    }
    button.primary { background: var(--accent); color: #fff; }
    button.ok { background: var(--ok); color: #081510; }
    button.stop { background: var(--err); color: #fff; }
    button.sim { background: #3b6ef6; color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
    input {
      width: 100%; padding: 8px 10px; margin-top: 4px; border-radius: 7px;
      border: 1px solid #354070; background: #101426; color: var(--ink); font-size: 13px;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .preview-box {
      margin-top: 12px; background: #0b0e1a; border: 1px solid #2e3863;
      border-radius: 10px; padding: 10px; text-align: center;
    }
    canvas {
      width: 256px; height: 190px; image-rendering: pixelated;
      border: 2px solid var(--accent); background: #1a2238;
    }
    .info {
      margin-top: 8px; font-size: 11px; color: var(--muted); text-align: left;
      background: #101426; padding: 8px; border-radius: 8px; line-height: 1.45;
    }
    .status {
      margin-top: 10px; font-size: 12px; padding: 8px 10px; border-radius: 8px;
      background: #101426; color: var(--warn); word-break: break-word; line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>ACUMIL AUTO MAPS</h2>
    <div class="sub">
      1. Sambung BLE ke <b>Acumil-Maps</b> &bull; 2. Klik <b>Mulai Maps</b> untuk ikut GPS &amp; rute.<br/>
      <i>Catatan: Peta memakai tile OSM/Carto (tampilan berbeda dari Google Maps).</i>
    </div>

    <div class="row">
      <button id="btnConnect" class="primary">1. Sambung BLE</button>
      <button id="btnStartNav" class="ok" disabled>2. Mulai Maps</button>
      <button id="btnStopNav" class="stop" disabled>Stop</button>
    </div>

    <div class="row">
      <button id="btnUseHere" type="button">Ambil GPS Sekarang</button>
      <button id="btnSimStep" class="sim" type="button">Simulasi Maju</button>
    </div>

    <div class="grid2">
      <div>
        <label>Lat Tujuan</label>
        <input id="destLat" type="number" step="0.00001" value="-6.2442" />
      </div>
      <div>
        <label>Lon Tujuan</label>
        <input id="destLon" type="number" step="0.00001" value="106.8004" />
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Zoom Peta (14-17)</label>
        <input id="zoom" type="number" min="14" max="17" value="16" />
      </div>
      <div>
        <label>Jeda Kirim (detik)</label>
        <input id="intervalSec" type="number" min="2" max="15" value="3" />
      </div>
    </div>

    <div class="preview-box">
      <canvas id="cv" width="128" height="95"></canvas>
      <div id="liveNav" class="info">
        Arah: - | Jarak: - | Jalan: - | Info: -<br/>
        GPS: -
      </div>
    </div>

    <div id="status" class="status">Status: Belum terhubung ke Acumil-Maps.</div>
  </div>

  <script>
    const SVC_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const TXT_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const IMG_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    const W = 128;
    const H = 95;
    const FRAME_BYTES = W * H * 2;
    const CHUNK_SIZE = 120;

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d', { willReadFrequently: true });

    const btnConnect = document.getElementById('btnConnect');
    const btnStartNav = document.getElementById('btnStartNav');
    const btnStopNav = document.getElementById('btnStopNav');
    const btnUseHere = document.getElementById('btnUseHere');
    const btnSimStep = document.getElementById('btnSimStep');
    const liveNavEl = document.getElementById('liveNav');
    const statusEl = document.getElementById('status');

    let bleDevice = null;
    let txtChar = null;
    let imgChar = null;
    let watchId = null;
    let loopTimer = null;
    let navRunning = false;
    let sending = false;

    let curLat = -6.2440;
    let curLon = 106.8000;
    let curAcc = null;
    let gpsFixCount = 0;
    let prevLat = null;
    let prevLon = null;
    let headingDeg = 90;

    let routeCoords = []; // [lon, lat]
    let routeSteps = [];
    let lastRouteFetchAt = 0;
    let routeSourceLabel = 'Langsung';

    let navDir = 0;
    let navDistText = '0 m';
    let navStreetText = 'Siap jalan';
    let navFooterText = 'Menunggu GPS';

    const tileCache = new Map();

    function setStatus(msg, state = 'warn') {
      statusEl.textContent = 'Status: ' + msg;
      if (state === 'ok') statusEl.style.color = '#2ee59d';
      else if (state === 'err') statusEl.style.color = '#ff5c77';
      else statusEl.style.color = '#ffb84d';
    }

    function toRad(d) { return (d * Math.PI) / 180; }
    function toDeg(r) { return (r * 180) / Math.PI; }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function bearingDeg(lat1, lon1, lat2, lon2) {
      const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function turnFromDelta(currentHeading, targetBearing) {
      let diff = ((targetBearing - currentHeading + 540) % 360) - 180;
      if (diff < -25) return -1;
      if (diff > 25) return 1;
      return 0;
    }

    function formatDist(meters) {
      if (meters >= 1000) return (meters / 1000).toFixed(1) + ' km';
      return Math.max(0, Math.round(meters / 5) * 5) + ' m';
    }

    function buildFallbackRoute(destLat, destLon) {
      routeCoords = [];
      routeSteps = [];
      const steps = 12;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const lat = curLat + (destLat - curLat) * t;
        const lon = curLon + (destLon - curLon) * t;
        routeCoords.push([lon, lat]);
      }
      routeSourceLabel = 'Garis Lurus';
      const totalM = haversineMeters(curLat, curLon, destLat, destLon);
      const estMin = Math.max(1, Math.round(totalM / 400));
      navFooterText = `${estMin} mnt - ${formatDist(totalM)}`;
    }

    async function updateRouteIfNeeded(destLat, destLon, force = false) {
      const now = Date.now();
      if (!force && now - lastRouteFetchAt < 7000 && routeCoords.length > 1) return;
      lastRouteFetchAt = now;

      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 3500);
        const url = `https://router.project-osrm.org/route/v1/driving/${curLon},${curLat};${destLon},${destLat}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);

        const data = await res.json();
        if (data.code === 'Ok' && data.routes && data.routes[0] &&
            data.routes[0].geometry && Array.isArray(data.routes[0].geometry.coordinates) &&
            data.routes[0].geometry.coordinates.length > 1) {
          const r = data.routes[0];
          routeCoords = r.geometry.coordinates;
          routeSteps = (r.legs && r.legs[0] && r.legs[0].steps) ? r.legs[0].steps : [];
          routeSourceLabel = 'OSRM';

          const remDist = formatDist(r.distance || 0);
          const remMin = Math.max(1, Math.round((r.duration || 0) / 60));
          navFooterText = `${remMin} mnt - ${remDist}`;
          return;
        }
      } catch (_) {}

      buildFallbackRoute(destLat, destLon);
    }

    function computeTurnGuidance(destLat, destLon) {
      if (prevLat !== null && prevLon !== null) {
        const moved = haversineMeters(prevLat, prevLon, curLat, curLon);
        if (moved > 1.5) {
          headingDeg = bearingDeg(prevLat, prevLon, curLat, curLon);
        }
      }
      prevLat = curLat;
      prevLon = curLon;

      if (routeSteps.length > 0) {
        let chosen = routeSteps[routeSteps.length - 1];
        for (const st of routeSteps) {
          const loc = st.maneuver && st.maneuver.location;
          if (!loc) continue;
          const d = haversineMeters(curLat, curLon, loc[1], loc[0]);
          if (d > 10) {
            chosen = st;
            break;
          }
        }
        const loc = chosen.maneuver && chosen.maneuver.location;
        if (loc) {
          const dMeters = haversineMeters(curLat, curLon, loc[1], loc[0]);
          const brg = bearingDeg(curLat, curLon, loc[1], loc[0]);
          navDir = turnFromDelta(headingDeg, brg);
          navDistText = formatDist(dMeters);
        }
        navStreetText = (chosen.name && chosen.name.trim().length > 0)
          ? chosen.name.trim().slice(0, 16)
          : 'Ikuti Rute';
      } else {
        const dMeters = haversineMeters(curLat, curLon, destLat, destLon);
        const brg = bearingDeg(curLat, curLon, destLat, destLon);
        navDir = turnFromDelta(headingDeg, brg);
        navDistText = formatDist(dMeters);
        navStreetText = 'Arah Tujuan';
      }

      const accStr = (curAcc !== null) ? `±${Math.round(curAcc)}m` : 'simulasi';
      liveNavEl.innerHTML =
        `Arah: <b>${navDir}</b> | Jarak: <b>${navDistText}</b> | Jalan: <b>${navStreetText}</b> | Info: <b>${navFooterText}</b><br/>` +
        `GPS (${routeSourceLabel}): ${curLat.toFixed(5)}, ${curLon.toFixed(5)} (${accStr}) | Hdg: ${Math.round(headingDeg)}°`;
    }

    function lon2tileX(lon, z) {
      return ((lon + 180) / 360) * Math.pow(2, z);
    }

    function lat2tileY(lat, z) {
      const rad = toRad(lat);
      return ((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2) * Math.pow(2, z);
    }

    function loadTileImage(z, x, y) {
      const n = Math.pow(2, z);
      const wx = ((x % n) + n) % n;
      if (y < 0 || y >= n) return Promise.resolve(null);
      const key = `${z}/${wx}/${y}`;
      if (tileCache.has(key)) return tileCache.get(key);

      const urls = [
        `https://a.basemaps.cartocdn.com/rastertiles/voyager/${z}/${wx}/${y}.png`,
        `https://tile.openstreetmap.org/${z}/${wx}/${y}.png`
      ];

      const p = new Promise((resolve) => {
        let idx = 0;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const tryNext = () => {
          if (idx >= urls.length) {
            resolve(null);
            return;
          }
          img.src = urls[idx++];
        };
        img.onload = () => resolve(img);
        img.onerror = () => tryNext();
        tryNext();
      });

      tileCache.set(key, p);
      return p;
    }

    async function renderMapAndRoute(z, destLat, destLon) {
      ctx.fillStyle = '#e7e2d3';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#d3ccb8';
      ctx.lineWidth = 1;
      for (let gx = 0; gx < W; gx += 16) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
      }
      for (let gy = 0; gy < H; gy += 16) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
      }

      const tx = lon2tileX(curLon, z);
      const ty = lat2tileY(curLat, z);
      const centerTileX = Math.floor(tx);
      const centerTileY = Math.floor(ty);
      const offsetX = Math.round((W / 2) - (tx - centerTileX) * 256);
      const offsetY = Math.round((H / 2) - (ty - centerTileY) * 256);

      const minDX = Math.floor((-offsetX) / 256);
      const maxDX = Math.ceil((W - offsetX) / 256);
      const minDY = Math.floor((-offsetY) / 256);
      const maxDY = Math.ceil((H - offsetY) / 256);

      const jobs = [];
      for (let dy = minDY; dy <= maxDY; dy++) {
        for (let dx = minDX; dx <= maxDX; dx++) {
          const drawX = offsetX + dx * 256;
          const drawY = offsetY + dy * 256;
          jobs.push(
            loadTileImage(z, centerTileX + dx, centerTileY + dy).then((img) => {
              if (img) ctx.drawImage(img, drawX, drawY, 256, 256);
            })
          );
        }
      }
      await Promise.all(jobs);

      if (routeCoords.length > 1) {
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        let started = false;
        for (const pt of routeCoords) {
          const px = (W / 2) + (lon2tileX(pt[0], z) - tx) * 256;
          const py = (H / 2) + (lat2tileY(pt[1], z) - ty) * 256;
          if (!started) { ctx.moveTo(px, py); started = true; }
          else { ctx.lineTo(px, py); }
        }
        ctx.stroke();
      }

      const dpx = (W / 2) + (lon2tileX(destLon, z) - tx) * 256;
      const dpy = (H / 2) + (lat2tileY(destLat, z) - ty) * 256;
      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.arc(dpx, dpy, 4, 0, Math.PI * 2);
      ctx.fill();

      const cx = Math.floor(W / 2);
      const cy = Math.floor(H / 2);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function canvasToRgb565WithHeader() {
      const imgData = ctx.getImageData(0, 0, W, H).data;
      const out = new Uint8Array(4 + FRAME_BYTES);
      out[0] = 0xAA; out[1] = 0x55; out[2] = 0xA5; out[3] = 0x5A;

      let p = 4;
      for (let i = 0; i < imgData.length; i += 4) {
        const rgb565 = ((imgData[i] & 0xF8) << 8) | ((imgData[i + 1] & 0xFC) << 3) | (imgData[i + 2] >> 3);
        out[p++] = rgb565 & 0xFF;
        out[p++] = (rgb565 >> 8) & 0xFF;
      }
      return out;
    }

    async function writeCharSafe(ch, bytes) {
      if (typeof ch.writeValueWithoutResponse === 'function') {
        try {
          await ch.writeValueWithoutResponse(bytes);
          return;
        } catch (_) {}
      }
      await ch.writeValue(bytes);
    }

    async function pushNavToBle() {
      if (sending) return;
      sending = true;
      try {
        const destLat = parseFloat(document.getElementById('destLat').value);
        const destLon = parseFloat(document.getElementById('destLon').value);
        const validDestLat = Number.isFinite(destLat) ? destLat : -6.2442;
        const validDestLon = Number.isFinite(destLon) ? destLon : 106.8004;
        const z = Math.min(17, Math.max(14, parseInt(document.getElementById('zoom').value, 10) || 16));

        await updateRouteIfNeeded(validDestLat, validDestLon, false);
        computeTurnGuidance(validDestLat, validDestLon);
        await renderMapAndRoute(z, validDestLat, validDestLon);

        if (!txtChar || !imgChar || !bleDevice || !bleDevice.gatt || !bleDevice.gatt.connected) {
          setStatus('Preview diperbarui (BLE belum terhubung).', 'warn');
          return;
        }

        const payload = `${navDir}|${navDistText}|${navStreetText}|${navFooterText}`;
        await writeCharSafe(txtChar, new TextEncoder().encode(payload));
        await new Promise((r) => setTimeout(r, 20));

        const packet = canvasToRgb565WithHeader();
        for (let offset = 0; offset < packet.length; offset += CHUNK_SIZE) {
          if (!bleDevice.gatt.connected) throw new Error('BLE terputus saat kirim');
          const slice = packet.slice(offset, offset + CHUNK_SIZE);
          await writeCharSafe(imgChar, slice);
          await new Promise((r) => setTimeout(r, 18));
        }

        setStatus(`Terkirim ke Acumil-Maps: ${navDistText} ke ${navStreetText}`, 'ok');
      } catch (err) {
        setStatus('Pengiriman ditolak/gagal: ' + (err.message || err), 'err');
      } finally {
        sending = false;
      }
    }

    function requestOneShotGps(updateDestIfFar = false) {
      if (!navigator.geolocation) {
        setStatus('Browser tidak mendukung Geolocation.', 'err');
        return;
      }
      setStatus('Mengambil posisi GPS HP...', 'warn');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          curLat = pos.coords.latitude;
          curLon = pos.coords.longitude;
          curAcc = pos.coords.accuracy;
          gpsFixCount++;
          if (updateDestIfFar) {
            document.getElementById('destLat').value = (curLat - 0.0045).toFixed(5);
            document.getElementById('destLon').value = (curLon + 0.0055).toFixed(5);
          }
          updateRouteIfNeeded(
            parseFloat(document.getElementById('destLat').value),
            parseFloat(document.getElementById('destLon').value),
            true
          ).then(() => pushNavToBle());
        },
        (err) => {
          setStatus('GPS gagal/ditolak: ' + err.message + ' (pakai koordinat aktif)', 'err');
          pushNavToBle();
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
      );
    }

    function startAutoMaps() {
      if (navRunning) return;
      navRunning = true;
      btnStartNav.disabled = true;
      btnStopNav.disabled = false;

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            curLat = pos.coords.latitude;
            curLon = pos.coords.longitude;
            curAcc = pos.coords.accuracy;
            gpsFixCount++;
          },
          (err) => {
            setStatus('Watch GPS: ' + err.message, 'err');
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 8000 }
        );
      }

      const sec = Math.max(2, Math.min(15, parseInt(document.getElementById('intervalSec').value, 10) || 3));
      pushNavToBle();
      loopTimer = setInterval(() => {
        if (navRunning) {
          pushNavToBle();
        }
      }, sec * 1000);
    }

    function stopAutoMaps() {
      navRunning = false;
      btnStartNav.disabled = false;
      btnStopNav.disabled = true;
      if (watchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (loopTimer !== null) {
        clearInterval(loopTimer);
        loopTimer = null;
      }
      setStatus('Navigasi otomatis dihentikan.', 'warn');
    }

    btnUseHere.addEventListener('click', () => {
      requestOneShotGps(true);
    });

    btnSimStep.addEventListener('click', async () => {
      const destLat = parseFloat(document.getElementById('destLat').value) || -6.2442;
      const destLon = parseFloat(document.getElementById('destLon').value) || 106.8004;
      if (routeCoords.length < 2) {
        await updateRouteIfNeeded(destLat, destLon, true);
      }
      if (routeCoords.length > 1) {
        const idx = Math.min(routeCoords.length - 1, Math.max(1, Math.floor(routeCoords.length * 0.15)));
        curLon = routeCoords[idx][0];
        curLat = routeCoords[idx][1];
        curAcc = null;
      } else {
        curLat += (destLat - curLat) * 0.15;
        curLon += (destLon - curLon) * 0.15;
      }
      await pushNavToBle();
    });

    btnConnect.addEventListener('click', async () => {
      try {
        setStatus('Mencari Acumil-Maps...', 'warn');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Acumil-Maps' }],
          optionalServices: [SVC_UUID]
        });
        bleDevice.addEventListener('gattserverdisconnected', () => {
          stopAutoMaps();
          btnStartNav.disabled = true;
          setStatus('BLE terputus dari Acumil-Maps.', 'err');
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SVC_UUID);
        txtChar = await service.getCharacteristic(TXT_UUID);
        imgChar = await service.getCharacteristic(IMG_UUID);

        btnStartNav.disabled = false;
        setStatus('Terhubung ke Acumil-Maps! Klik "2. Mulai Maps".', 'ok');
      } catch (err) {
        setStatus('Koneksi BLE gagal: ' + (err.message || err), 'err');
      }
    });

    btnStartNav.addEventListener('click', startAutoMaps);
    btnStopNav.addEventListener('click', stopAutoMaps);

    (async () => {
      const destLat = parseFloat(document.getElementById('destLat').value) || -6.2442;
      const destLon = parseFloat(document.getElementById('destLon').value) || 106.8004;
      await updateRouteIfNeeded(destLat, destLon, true);
      computeTurnGuidance(destLat, destLon);
      await renderMapAndRoute(16, destLat, destLon);
    })();
  </script>
</body>
</html>
